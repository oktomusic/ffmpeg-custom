---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1.18.0
    permissions:
      contents: read
      packages: write # Publish to ghcr.io
      id-token: write # Used to sign the image
      attestations: write # Used to write attestations to the repository
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name != 'pull_request' }}
      cache: false
      sign: auto
      sbom: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
      set-meta-annotations: true
      set-meta-labels: true
      labels: |
        org.opencontainers.image.title=Oktomusic Custom FFmpeg
        org.opencontainers.image.description=Custom build of FFmpeg for Oktomusic project
        org.opencontainers.image.authors=AFCMS <afcm.contact@gmail.com>
        org.opencontainers.image.licenses=LGPL-2.1-only
        org.opencontainers.image.source=https://github.com/oktomusic/ffmpeg-custom
        io.artifacthub.package.readme-url=https://raw.githubusercontent.com/oktomusic/ffmpeg-custom/refs/heads/master/README.md
        io.artifacthub.package.category=skip-prediction
        io.artifacthub.package.keywords=music,media,tool
        io.artifacthub.package.license=LGPL-2.1-only
        io.artifacthub.package.maintainers=[{"name":"AFCMS","email":"afcm.contact@gmail.com"}]
      annotations: |
        org.opencontainers.image.title=Oktomusic Custom FFmpeg
        org.opencontainers.image.description=Custom build of FFmpeg for Oktomusic project
        org.opencontainers.image.authors=AFCMS <afcm.contact@gmail.com>
        org.opencontainers.image.licenses=LGPL-2.1-only
        org.opencontainers.image.source=https://github.com/oktomusic/ffmpeg-custom
        io.artifacthub.package.readme-url=https://raw.githubusercontent.com/oktomusic/ffmpeg-custom/refs/heads/master/README.md
        io.artifacthub.package.category=skip-prediction
        io.artifacthub.package.keywords=music,media,tool
        io.artifacthub.package.license=LGPL-2.1-only
        io.artifacthub.package.maintainers=[{"name":"AFCMS","email":"afcm.contact@gmail.com"}]

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
